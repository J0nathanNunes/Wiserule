name = "wiserule"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "wiserule-db"
database_id = "dd68bb09-6e33-4113-b2f9-66e46449ab1c"

# Durable Object para tareas asíncronas
[[durable_objects.bindings]]
name = "TAREA_ANALISIS"
class_name = "TareaAnalisis"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TareaAnalisis"]

# Variables de entorno (no secretas)
[vars]
APP_NAME = "Wiserule"
MINHA_RECEITA_URL = "https://minhareceita.org"
OPENROUTER_BASE_URL = "https://openrouter.ai/api/v1"
GERANET_BASE_URL = "https://nfe.geranet.net/api/v1"
MAX_FILE_SIZE_MB = "5"
MODELO_OCR = "openai/gpt-4o-mini"
MODELO_ANALISE = "openai/gpt-4o-mini"
MODELO_VISAO = "openai/gpt-4o-mini"
# Modelos secundário e terciário para redundância real no OCR
MODELO_OCR_ALT = "google/gemini-2.5-flash"
MODELO_VISAO_ALT = "openai/gpt-6-luna-pro"

# CORS
CORS_ORIGINS = "https://wiserule.com,https://www.wiserule.com,https://wiserule.pages.dev,http://localhost:3000"

# NOTA: Las claves secretas (OPENROUTER_API_KEY, TAVILY_API_KEY, GERANET_API_KEY, etc.)
# se configuran en el dashboard de Cloudflare > Workers > Settings > Variables
# como "Secrets", NO en este archivo.