[build]
  base = "frontend"
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

# Redireciona /api/* para o backend no Railway
# 🔴 TROQUE pela URL do Railway depois do deploy
[[redirects]]
  from = "/api/*"
  to = "https://wiserule-backend.up.railway.app/:splat"
  status = 200