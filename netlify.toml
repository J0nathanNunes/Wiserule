[build]
  base = "frontend"
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

[context.production.environment]
  NEXT_PUBLIC_API_URL = "https://wiserule-production.up.railway.app"

# Redireciona /api/* para o backend no Railway
[[redirects]]
  from = "/api/*"
  to = "https://wiserule-production.up.railway.app/:splat"
  status = 200