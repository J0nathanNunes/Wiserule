[build]
  base = "frontend"
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

# Redireciona /api/* para o backend
# Troque a URL quando fizer deploy do backend
[[redirects]]
  from = "/api/*"
  to = "https://backend-wiserule.onrender.com/:splat"
  status = 200